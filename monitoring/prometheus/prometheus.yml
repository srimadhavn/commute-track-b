# Prometheus: every 15 s, visit each target's /metrics page and store the numbers.
# Targets are Compose service names (Docker's internal DNS resolves them).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels: { service: api }

  - job_name: ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestor:9101"]
        labels: { service: ingestor }

  # The monitoring stack watches itself too.
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels: { service: loki }

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels: { service: alloy }
